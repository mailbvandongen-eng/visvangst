name: Data ophalen en publiceren

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *' # elke drie uur: verse getij-, watertemperatuur- en maandata
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Getij, watertemperatuur en maan ophalen
        run: npm run data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub zet geplande workflows uit na 60 dagen zonder commits; dit houdt hem aan
      - name: Workflow actief houden
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
